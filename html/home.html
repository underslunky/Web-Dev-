<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Personal Portfolio</title>

  <style>
    body {
      margin: 0;
      background-color: lightgrey;
    }

    h1 {
      text-align: center;
      color: white;
    }

    p {
      text-align: center;
      color: white;
      font-size: 20px;
    }

    .top-bar {
      width: 100%;
      background-color: darkgrey;
      color: white;
      padding: 20px 40px;
      font-family: serif;
      font-size: 32px;
      text-align: center;
      box-sizing: border-box;
    }

    .sidenav {
      height: 100%;
      width: 0;
      position: fixed;
      z-index: 1;
      top: 0;
      left: 0;
      background-color: darkgrey;
      overflow-x: hidden;
      transition: 1s;
      padding-top: 60px;
    }

    .sidenav a {
      padding: 8px 8px 8px 32px;
      text-decoration: none;
      font-size: 25px;
      color: white;
      display: block;
      transition: 0.3s;
    }

    .sidenav a:hover {
      color: black;
    }

    .sidenav .closebtn {
      position: absolute;
      top: 0;
      right: 25px;
      font-size: 36px;
      margin-left: 50px;
    }

    .alienimage {
      float: right;
      margin-right: 27vw;
    }

    @media screen and (max-height: 450px) {
      .sidenav { padding-top: 15px; }
      .sidenav a { font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    Julian Scott-Kearns <br>
    <span style="font-size:25px;">Portfolio Personnel</span>
  </div>

  <div style="background-color:darkgrey; padding: 4px 40px 8px; text-align:right;">
    <span style="color:white; font-family:sans-serif; font-size:14px; cursor:pointer; text-decoration:underline;" onclick="logout()">Déconnexion</span>
  </div>

  <nav id="mySidenav" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <a href="home.html">Home</a>
    <a href="mes-interets.html">Mes Intérêts</a>
    <a href="mes-competences.html">Mes Compétences</a>
  </nav>

  <span style="font-size:30px; cursor:pointer; color:white; background:darkgrey; padding:8px 16px; display:inline-block;" onclick="openNav()">&#9776; Ouvrir</span>

  <img src="img/alien-face.jpg" class="alienimage" alt="alien face" width="650" height="500">

  <h1>Bonjour, Mon nom est Julian Scott-Kearns.</h1>

  <p>Je suis en dixième année et voici mon portfolio personnel. Je vais vous parler de moi, de mes intérêts et de mes compétences.</p>

  <script>
    const SESSION_KEY = 'app_session';

    const user = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
    if (!user) window.location.href = '/Web-Dev-/index.html';

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_KEY);
      window.location.href = '/Web-Dev-/index.html';
    }

    function openNav()  { document.getElementById('mySidenav').style.width = '250px'; }
    function closeNav() { document.getElementById('mySidenav').style.width = '0'; }
  </script>

</body>
</html>
